<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="760" viewBox="0 0 1080 760"><rect width="1080" height="760" fill="#f7fafb"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#203d49"><text x="50" y="55" font-size="25" font-weight="bold">LD-Flex · 低成本台架结构尺寸</text><text x="50" y="84" font-size="14" fill="#738791">建议加工尺寸 / 单位 mm / 示意图不按打印比例量取</text><rect x="55" y="130" width="595" height="460" rx="12" fill="#fff" stroke="#cad9df" stroke-width="2"/><text x="80" y="163" font-size="16">俯视结构 · 底座约 320 × 240</text><path d="M350 210 L350 370 L225 505 M350 370 L475 505" fill="none" stroke="#d6e2e7" stroke-width="65" stroke-linecap="round"/><path d="M350 210 L350 370 L225 505 M350 370 L475 505" fill="none" stroke="#fff" stroke-width="44"/><rect x="308" y="253" width="84" height="13" fill="#13786e"/><circle cx="350" cy="370" r="16" fill="#b5d8cf" stroke="#13786e" stroke-width="2"/><path d="M350 370 L370 408" stroke="#13786e" stroke-width="7"/><circle cx="384" cy="300" r="8" fill="#e7aa3c"/><circle cx="253" cy="439" r="8" fill="#e7aa3c"/><circle cx="447" cy="439" r="8" fill="#e7aa3c"/><rect x="181" y="522" width="90" height="33" rx="5" fill="#e5f3ee"/><rect x="431" y="522" width="90" height="33" rx="5" fill="#e7eff8"/><text x="202" y="544" font-size="14">A 接料盒</text><text x="451" y="544" font-size="14">B 接料盒</text><g stroke="#8fa7b1" fill="none"><path d="M90 215 H296 M90 250 H300 M400 300 H586 M391 369 H589 M136 394 H283"/><path d="M301 195 V333 M295 195 H306 M295 333 H306"/></g><text x="92" y="206" font-size="13">人工单件放置区</text><text x="92" y="245" font-size="13">闸门 / 舵机 1</text><text x="421" y="292" font-size="13">入口光电</text><text x="427" y="361" font-size="13">分流板 / 舵机 2</text><text x="91" y="389" font-size="13">滑槽净宽约 28</text><text x="266" y="288" font-size="12" transform="rotate(-90 266 288)">主滑槽长 180</text><rect x="680" y="130" width="345" height="215" rx="12" fill="#fff" stroke="#cad9df"/><text x="704" y="163" font-size="16">侧视 / 坡度试调</text><path d="M720 292 H979 L755 210 Z" fill="#e4eef0" stroke="#91adb8"/><path d="M751 200 L982 287" stroke="#13786e" stroke-width="6"/><text x="763" y="321" font-size="13">约 20° 起调，侧壁高约 25</text><rect x="680" y="369" width="345" height="221" rx="12" fill="#fff" stroke="#cad9df"/><text x="704" y="402" font-size="16">加工与安装顺序</text><g font-size="13" fill="#54717e"><text x="704" y="437">1. 先做直滑槽，手放物料确认能通过。</text><text x="704" y="467">2. 装闸门和分流板，再安装光电。</text><text x="704" y="497">3. 舵机先空载标定，再接机械连杆。</text><text x="704" y="527">4. 末端接料盒固定，避免物料掉落。</text><text x="704" y="557">5. 控制板与电源固定在干燥底座上。</text></g><rect x="55" y="623" width="970" height="85" rx="10" fill="#eaf4f0"/><text x="78" y="654" font-size="15">第一轮物料：同批轻质方块，约 15–20 mm，单件不超过 10 g。</text><text x="78" y="682" font-size="13" fill="#607c79">人工一次放一件。多物料自动分离需要额外机械设计；不要用软件计数替代对实际通道的检查。</text></g></svg>
